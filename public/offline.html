<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook is offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f8f5ee; color: #2a231c; }
  @media (prefers-color-scheme: dark) { body { background: #171411; color: #efe9dd; } }
  main { max-width: 22rem; padding: 2rem; }
  h1 { font: 600 1.6rem Georgia, serif; margin: 0 0 .5rem; }
  button { margin-top: 1rem; padding: .7rem 1.1rem; border: 0; border-radius: .75rem; background: #155e46; color: #fff; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Daybook needs a connection to show your day. Your changes on Telegram are unaffected.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
